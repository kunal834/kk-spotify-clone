<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Sage to Amber Gradient -->
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82C39B" />
      <stop offset="100%" stop-color="#E0A96D" />
    </linearGradient>
    <!-- Extremely soft glow filter for eye comfort -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Cozy Tech Ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#cyberGrad)" stroke-width="4" opacity="0.25" />
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-dasharray="40 25" filter="url(#neonGlow)" opacity="0.8" />
  
  <!-- Inner Cozy Wave Form -->
  <path d="M 50,100 Q 75,60 100,100 T 150,100" fill="none" stroke="#82C39B" stroke-width="3" filter="url(#neonGlow)" opacity="0.6"/>
  <path d="M 50,100 Q 75,130 100,100 T 150,100" fill="none" stroke="#E0A96D" stroke-width="3" filter="url(#neonGlow)" opacity="0.6"/>
  
  <!-- Center Typographic Brand initials "C" -->
  <circle cx="100" cy="100" r="35" fill="#121612" stroke="url(#cyberGrad)" stroke-width="2" />
  <text x="100" y="112" font-family="'Outfit', sans-serif" font-size="40" font-weight="900" fill="#f3f3ee" text-anchor="middle" letter-spacing="1">C</text>
</svg>
